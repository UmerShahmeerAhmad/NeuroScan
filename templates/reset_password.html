<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password – NeuroScan AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2336d1c4'/%3E%3Cpath d='M16 7c-4 0-7 3-7 7 0 2 1 3 1 5 0 3 2 6 6 6s6-3 6-6c0-2 1-3 1-5 0-4-3-7-7-7z' fill='none' stroke='%2304211f' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-aside">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8"/>
          <path d="M16 7c-4 0-7 3-7 7 0 2 1 3 1 5 0 3 2 6 6 6s6-3 6-6c0-2 1-3 1-5 0-4-3-7-7-7z"/>
          <path d="M16 8v16"/>
        </svg>
        NeuroScan AI
      </a>
      <div>
        <h2>Verified doctors read their scans here</h2>
        <p>Accounts are approved by the administrator after checking your institution, designation and license number.</p>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a class="brand auth-mobile-brand" href="/">NeuroScan AI</a>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-sub">At least 8 characters, with a letter and a number.</p>
        <div id="formAlert" role="alert" hidden></div>
        <form id="resetForm" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <div class="input-wrap">
              <input class="input" id="password" type="password" autocomplete="new-password" required autofocus>
              <button class="toggle" type="button" data-toggle-password aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="confirm">Repeat the password</label>
            <input class="input" id="confirm" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Change password</button>
        </form>
        <p class="auth-foot"><a href="/forgot-password">Request a new link</a></p>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    (function () {
      var token = new URLSearchParams(location.search).get('token') || '';
      var form = document.getElementById('resetForm');
      var alertBox = document.getElementById('formAlert');
      var button = document.getElementById('submitBtn');
      if (!token) {
        NS.showAlert(alertBox, 'This page needs the link from your email. Request a new one.', 'error');
        form.hidden = true;
      }
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        NS.hideAlert(alertBox);
        var pw = document.getElementById('password').value;
        if (pw !== document.getElementById('confirm').value) {
          NS.showAlert(alertBox, 'The two passwords do not match.', 'error'); return;
        }
        NS.setLoading(button, true, 'Saving…');
        try {
          await NS.api('/api/auth/reset-password', { method: 'POST', json: { token: token, password: pw }, auth: false });
          NS.clearSession && NS.clearSession();
          location.replace('/login?reset=1');
        } catch (err) {
          NS.showAlert(alertBox, err.message, 'error');
          NS.setLoading(button, false);
        }
      });
    })();
  </script>
</body>
</html>
