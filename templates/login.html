<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – NeuroScan AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2336d1c4'/%3E%3Cpath d='M16 7c-4 0-7 3-7 7 0 2 1 3 1 5 0 3 2 6 6 6s6-3 6-6c0-2 1-3 1-5 0-4-3-7-7-7z' fill='none' stroke='%2304211f' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-aside">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8"/>
          <path d="M16 7c-4 0-7 3-7 7 0 2 1 3 1 5 0 3 2 6 6 6s6-3 6-6c0-2 1-3 1-5 0-4-3-7-7-7z"/>
          <path d="M16 8v16"/>
        </svg>
        NeuroScan AI
      </a>
      <div>
        <h2>Verified doctors read their scans here</h2>
        <p>Accounts are approved by the administrator after checking your institution, designation and license number.</p>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a class="brand auth-mobile-brand" href="/">NeuroScan AI</a>
        <h1 class="auth-title">Log in</h1>
        <p class="auth-sub">Use the email and password you registered with.</p>

        <div id="formAlert" role="alert" hidden></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="toggle" type="button" data-toggle-password aria-pressed="false">Show</button>
            </div>
          </div>
          <p class="auth-sub" style="margin:-4px 0 16px;text-align:right"><a href="/forgot-password">Forgot your password?</a></p>
          <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Log in</button>
        </form>

        <p class="auth-foot">New here? <a href="/signup">Request doctor access</a></p>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    (function () {
      NS.redirectIfLoggedIn();

      var form = document.getElementById('loginForm');
      var alertBox = document.getElementById('formAlert');
      var button = document.getElementById('submitBtn');
      var params = new URLSearchParams(location.search);

      if (params.get('reset')) {
        NS.showAlert(alertBox, 'Your password was changed. Log in with the new one.', 'success');
      }
      if (params.get('expired')) {
        NS.showAlert(alertBox, 'Your session has ended. Please log in again.', 'info');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        NS.hideAlert(alertBox);

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) {
          NS.showAlert(alertBox, 'Enter your email and password.', 'error');
          return;
        }

        NS.setLoading(button, true, 'Logging in…');
        try {
          var data = await NS.api('/api/auth/login', {
            method: 'POST',
            json: { email: email, password: password },
            auth: false
          });
          NS.saveSession(data);
          location.replace(data.role === 'admin' ? '/admin' : '/doctor');
        } catch (err) {
          // 403 means the password was right but the account is not approved yet.
          NS.showAlert(alertBox, err.message, err.status === 403 ? 'warn' : 'error');
          NS.setLoading(button, false);
        }
      });
    })();
  </script>
</body>
</html>
