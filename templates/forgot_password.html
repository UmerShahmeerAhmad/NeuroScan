<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password – NeuroScan AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2336d1c4'/%3E%3Cpath d='M16 7c-4 0-7 3-7 7 0 2 1 3 1 5 0 3 2 6 6 6s6-3 6-6c0-2 1-3 1-5 0-4-3-7-7-7z' fill='none' stroke='%2304211f' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-aside">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8"/>
          <path d="M16 7c-4 0-7 3-7 7 0 2 1 3 1 5 0 3 2 6 6 6s6-3 6-6c0-2 1-3 1-5 0-4-3-7-7-7z"/>
          <path d="M16 8v16"/>
        </svg>
        NeuroScan AI
      </a>
      <div>
        <h2>Verified doctors read their scans here</h2>
        <p>Accounts are approved by the administrator after checking your institution, designation and license number.</p>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a class="brand auth-mobile-brand" href="/">NeuroScan AI</a>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-sub">Enter your email. If the account can log in, we send a link that works once.</p>
        <div id="formAlert" role="alert" hidden></div>
        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="username" required autofocus>
          </div>
          <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Send reset link</button>
        </form>
        <p class="auth-foot"><a href="/login">Back to log in</a></p>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    (function () {
      var form = document.getElementById('forgotForm');
      var alertBox = document.getElementById('formAlert');
      var button = document.getElementById('submitBtn');
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        NS.hideAlert(alertBox);
        var email = document.getElementById('email').value.trim();
        if (!email) { NS.showAlert(alertBox, 'Enter your email.', 'error'); return; }
        NS.setLoading(button, true, 'Sending…');
        try {
          var data = await NS.api('/api/auth/forgot-password', { method: 'POST', json: { email: email }, auth: false });
          NS.showAlert(alertBox, data.message, 'success');
          form.hidden = true;
        } catch (err) {
          NS.showAlert(alertBox, err.message, 'error');
          NS.setLoading(button, false);
        }
      });
    })();
  </script>
</body>
</html>
